title = "URL shortener gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Build output, tools, and clearly marked fake fixtures"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)target/''',
  '''(^|/)dist/''',
  '''(^|/)\.tools/''',
  '''(^|/)\.cache/''',
  '''(^|/)h2data/''',
  '''(^|/)\.git/''',
  '''backend/src/test/resources/security/fake-secrets/''',
  '''docs/gates/tmp/''',
  # agent git worktrees are scratch copies of the repository, not shipped files
  '''(^|/)\.claude/worktrees/''',
  # deliberately fake credentials used to prove the detectors work (test code and evaluation fixtures only)
  '''backend/src/test/java/.+/(AgentOutputEvaluatorTest|PolicyEngineTest|HeldOutputIT|ScenarioPipelineEvalIT|AgentSafetyTest|SecretInStructuredOutputTest|PolicyEngineJsonSecretTest)\.java''',
  '''eval/degraded\.json''',
]
